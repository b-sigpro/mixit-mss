_base_: ${base_config_path}/train_base.yaml # ${base_config_path}/train_ddp.yaml

seed: 2026

sr: 44100
n_fft: 2048
hop_length: 512

n_src: 4

trainer:
  plugins: null
  devices: ${oc.decode:${oc.env:LOCAL_WORLD_SIZE}}
  num_nodes: 1
  
  max_epochs: 900
  check_val_every_n_epoch: 5
  gradient_clip_val: 5.0
  sync_batchnorm: True

  benchmark: True
  use_distributed_sampler: False
  precision: bf16-mixed

  callbacks:
    - _target_: lightning.pytorch.callbacks.ModelCheckpoint
      filename: "{epoch:04d}"
      save_top_k: 5
      monitor: validation/loss
      mode: min
      save_last: True
    - _target_: lightning.pytorch.callbacks.RichProgressBar
      refresh_rate: 5
    - _target_: lightning.pytorch.callbacks.RichModelSummary
      max_depth: 3

datamodule:
  _target_: mixit_mss.common.datamodules.hdf5_wav_datamodule.DataModule
  train_dataset_path: 
    - ./recipes/musdb18hq/hdf5/train_bass_seg8sec_sad.hdf5
    - ./recipes/musdb18hq/hdf5/train_drums_seg8sec_sad.hdf5
    - ./recipes/musdb18hq/hdf5/train_vocals_seg8sec_sad.hdf5
    - ./recipes/musdb18hq/hdf5/train_other_seg8sec_sad.hdf5
  val_dataset_path: ./recipes/musdb18hq/hdf5/dev_unsegmented.hdf5
  batch_size: 4
  val_batch_size: 1
  sr: ${sr}
  duration: 6
  val_duration: null
  num_workers: 4
  return_ref: true
  use_scatter_dataset: true
  use_dm_dataset: true
  p_source_dropout: 0.05
  val_drop_last: false

task:
  _target_: mixit_mss.mixit.tasks.sup_task.SupTask
  n_fft: ${n_fft}
  hop_length: ${hop_length}
  normalize_mixture: true
  css_validation: true

  model:
    _target_: mixit_mss.mixit.model.model_wrapper.ModelWrapper
    n_fft: ${n_fft}
    hop_length: ${hop_length}
    fs: ${sr}
    scaling: true

    css_segment_size: 12
    css_shift_size: 6

    model:
      _target_: mixit_mss.mixit.model.bslocoformer.BSLocoformer
      num_spk: ${n_src}
      num_chan: 2

      n_layers: 6
      # general setup
      emb_dim: 128
      norm_type: rmsgroupnorm
      num_groups: 8  # used only in RMSGroupNorm
      tf_order: ft
      # self-attention related
      n_heads: 8
      flash_attention: true  # available when using mixed precision
      attention_dim: 128
      # ffn related
      ffn_type: 
        - swiglu_conv1d
        - swiglu_conv1d
      ffn_hidden_dim: 
        - 192
        - 192
      conv1d_kernel: 8
      conv1d_shift: 1
      dropout: 0.1
      # others
      eps: 1.0e-5
  
  loss:
    _target_: mixit_mss.mixit.loss.snr.ThresSNRLossWithInactiveSource
    solve_perm: false
    n_src: ${n_src}
    zeroref_weight: 0.1
    only_denominator: false


  optimizer_config:
    _target_: aiaccel.torch.lightning.OptimizerConfig
    optimizer_generator:
      _partial_: True
      _target_: torch.optim.AdamW
      lr: 1.e-3
      weight_decay: 1.e-2
      betas:
        - 0.9
        - 0.999
    scheduler_generator:
      _partial_: True
      _target_: mixit_mss.common.lr_schedulers.warmup.WarmUpStepLR
      warmup_steps: 5000
      decay_start_step: 60500  # 110 steps x 550 epochs
      decay_stop_step: 99000  # 110 steps x 990 epochs
      step_size: 220  # 2 epochs
      decay: 0.98
    scheduler_interval: step